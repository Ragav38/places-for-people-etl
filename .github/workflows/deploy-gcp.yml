name: Build and deploy ETL to GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: places-for-people-etl-project
  REGION: europe-west2
  REPOSITORY: places-for-people-etl
  IMAGE_NAME: etl
  JOB_NAME: places-for-people-etl
  DEPLOY_SERVICE_ACCOUNT: places-for-people-etl@places-for-people-etl-project.iam.gserviceaccount.com
  WIF_PROVIDER: projects/985215292635/locations/global/workloadIdentityPools/github-pool/providers/github-provider

jobs:
  deploy:
    name: Build image and deploy Cloud Run Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build and push container image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update "$JOB_NAME" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT_ID"

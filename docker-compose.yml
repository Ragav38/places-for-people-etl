services:
  etl:
    image: places-for-people-etl:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: local
      DATABASE_URL: ${ETL_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
        
  postgres:
    image: postgres:17
    container_name: chapters-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d chapters_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: chapters-airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL}
      PYTHONPATH: /opt/airflow/src
      ENVIRONMENT: local
      DATABASE_URL: ${ETL_DATABASE_URL}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./logs/airflow:/opt/airflow/logs
    command: standalone

volumes:
  postgres_data:
